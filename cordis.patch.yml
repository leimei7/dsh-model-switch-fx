# ============================================================================
# dsh-model-switch-fx —— DSH bundle patch
# ============================================================================
# 本文件是插件的挂载声明。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 这一条把插件行插入 Web profile 的配置树。
#
# 装了不用手改这里 —— `dsh plugin add` 会读 package.json 的 dsh.bundle.patch
# 自动应用本文件。下面只是把可配置项列出来备查。
#
# 安装：
#   dsh plugin --profile web add github:leimei7/dsh-model-switch-fx
# 装完记得重启 dsh web（配置树在启动时组装）。
#
# 可配置项（全部可省略）：
#   - insert:
#       - id: model-switch-fx
#         name: 'dsh-model-switch-fx'
#         config:
#           enabled: true      # false = 整个动画关掉
#           volume: 0.9        # 语音音量 0~1
#           sfx: true          # 启动音开关
#           sfxVolume: 0.5     # 启动音音量 0~1
#           fx: true           # 复古未来音频链开关
# ============================================================================

- insert:
    - id: model-switch-fx
      name: 'dsh-model-switch-fx'
