# ============================================================================
# dsh-model-switch-fx —— DSH bundle patch
# ============================================================================
# 本文件是插件的挂载声明。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 这一条把插件行插入 Web profile 的配置树。
#
# 安装（本地开发）：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 或直接在本 profile 的 cordis.patch.yml 里手写同样的 insert。
#
# 可配置项（都可省略）：
#   - insert:
#       - id: model-switch-fx
#         name: 'dsh-model-switch-fx'
#         config:
#           enabled: true        # 关掉动画但保留插件
#           volume: 0.9          # 语音音量 0~1
#           timeoutSlackMs: 2500 # 浏览器回报丢失时的兜底等待
# ============================================================================

- insert:
    - id: model-switch-fx
      name: 'dsh-model-switch-fx'
