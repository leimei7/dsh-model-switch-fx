<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SFX Lab · 8-bit 启动音试听</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#07070f;color:#c9d1e4;padding:28px 32px 60px;
    font:13px/1.7 'Cascadia Mono',Consolas,'Courier New',monospace}
  h1{font-size:17px;letter-spacing:.14em;color:#8ff;margin-bottom:6px}
  h2{font-size:12px;letter-spacing:.16em;color:#5a6480;margin:26px 0 10px;
    text-transform:uppercase;font-weight:600}
  p.note{color:#67718c;max-width:78ch;margin-bottom:18px}
  code{background:#111726;padding:1px 5px;border-radius:3px;color:#9fd}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  button{font:12px/1 inherit;letter-spacing:.06em;cursor:pointer;
    background:#0d1320;color:#b9c3d8;border:1px solid #212a3d;border-radius:5px;
    padding:8px 12px;transition:.12s}
  button:hover{border-color:#3d4a68;color:#e6ecf7}
  button.on{background:#13233a;border-color:#3f8fd0;color:#bfe4ff}
  table{border-collapse:collapse;width:100%;max-width:900px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #141b29;vertical-align:middle}
  th{color:#5a6480;font-size:11px;letter-spacing:.1em;font-weight:600}
  td.name{color:#dfe7f5;white-space:nowrap}
  td.desc{color:#67718c}
  canvas{width:100%;max-width:900px;height:110px;background:#0a0e18;
    border:1px solid #1a2233;border-radius:6px;display:block;margin-top:10px}
  .key{color:#8ff}
  .meta{color:#4d566d;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>SFX LAB · 8-bit 启动音</h1>
<p class="note">
  全部用 Web Audio 实时合成，<b>零音频文件</b>。脉冲波由傅里叶级数构造：
  <code>aₙ = 2/(nπ)·sin(nπ·d)</code>，<code>d</code> 是占空比 —— 这就是 NES 2A03 那四档音色。
  角色那一栏的音高来自各段语音实测的基频 F0（映射进 E4~E5 窗口后量化到半音），
  所以每个角色的启动音和它自己的声线同调。
</p>

<h2>占空比（音色）</h2>
<div class="row" id="duty"></div>

<h2>旋律候选</h2>
<table><tbody id="mel"></tbody></table>

<h2>调到各角色的调性上</h2>
<p class="note" style="margin-bottom:10px">先在上面选一个旋律，再点角色 —— 听同一段琶音在不同调上的效果。</p>
<div class="row" id="chars"></div>

<h2>波形（离线渲染，用来核对包络）</h2>
<canvas id="wave" width="1800" height="220"></canvas>
<div class="meta" id="meta">—</div>

<script>
'use strict'

/* ── 脉冲波：直接按傅里叶级数构造 ───────────────────────────────────────── */
const HARMONICS = 48
const waveCache = new Map()
function pulseWave(ctx, duty) {
  const key = duty
  if (waveCache.has(key)) return waveCache.get(key)
  const real = new Float32Array(HARMONICS + 1)
  const imag = new Float32Array(HARMONICS + 1)
  for (let n = 1; n <= HARMONICS; n++) {
    imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * duty)
  }
  const w = ctx.createPeriodicWave(real, imag, { disableNormalization: false })
  waveCache.set(key, w)
  return w
}

/* ── 音名 → 频率（十二平均律，A4 = 440）─────────────────────────────────── */
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }
function hz(name) {
  const m = /^([A-G])(#?)(\d)$/.exec(name)
  const n = SEMI[m[1]] + (m[2] === '#' ? 1 : 0) + (Number(m[3]) + 1) * 12
  return 440 * Math.pow(2, (n - 69) / 12)
}
/** 把频率量化到最近的半音，免得出现不在调上的微分音。 */
function quantize(f) { return 440 * Math.pow(2, Math.round(12 * Math.log2(f / 440)) / 12) }

/* ── 旋律候选：degree 是相对根音的半音数 ───────────────────────────────── */
const MELODIES = [
  { id: 'up4',   name: '上行四音',  desc: '0-4-7-12 大三和弦琶音上行，最经典的「系统就绪」手势', deg: [0, 4, 7, 12], step: 0.055, len: 0.11 },
  { id: 'ding',  name: '两音叮咚',  desc: '0-12 只有两个音，最短最干脆（约 180ms）',           deg: [0, 12],       step: 0.09,  len: 0.14 },
  { id: 'up3',   name: '三音上行',  desc: '0-7-12 空五度，比大三度更「仪器」一点',              deg: [0, 7, 12],    step: 0.07,  len: 0.13 },
  { id: 'five',  name: '五音快速',  desc: '0-4-7-12-16 更花哨，接近 1-UP 那种连琶',            deg: [0, 4, 7, 12, 16], step: 0.042, len: 0.09 },
  { id: 'down',  name: '下滑收束',  desc: '12-7-4-0 下行，更像「待机 / 关机」而不是开机',       deg: [12, 7, 4, 0], step: 0.055, len: 0.11 },
]

/* 角色 F0：来自 assets/*.mp3 的实测（自相关音高跟踪） */
const CHARS = {
  claude: 155, kimi: 222, qwen: 222, minimax: 241, glm: 242, musespark: 255,
  chatgpt: 279, grok: 329, deepseek: 333, mimo: 369, gemini: 429,
}
/* F0 的实测范围 */
const F0_MIN = 155, F0_MAX = 429
/* 目标窗口：A4 ~ E5（纯五度），跨度 7 个半音 */
const ROOT_LO = 440, ROOT_HI = 659.25
/**
 * 把 F0 **单调**映射进目标窗口再量化到半音。
 *
 * 不能用「折八度进窗口」的写法：那会让 329Hz 折成 E5、333Hz 留成 E4
 * —— 两个只差 4Hz 的声线落到相差一个八度的两个音上，听感极突兀。
 * 改成在音高（对数）空间线性插值，保证相近的 F0 一定得到相近的根音。
 */
function charRoot(f0) {
  const t = (Math.log2(f0) - Math.log2(F0_MIN)) / (Math.log2(F0_MAX) - Math.log2(F0_MIN))
  const f = ROOT_LO * Math.pow(2, t * Math.log2(ROOT_HI / ROOT_LO))
  return quantize(f)
}

/* ── 排布一段旋律（可离线也可实时）─────────────────────────────────────── */
function schedule(ctx, dest, mel, root, duty, gain) {
  const t0 = ctx.currentTime
  const wave = pulseWave(ctx, duty)
  mel.deg.forEach((semi, i) => {
    const f = root * Math.pow(2, semi / 12)
    const at = t0 + i * mel.step
    const osc = ctx.createOscillator()
    osc.setPeriodicWave(wave)
    osc.frequency.value = f
    const g = ctx.createGain()
    // NES 的包络是极快起音 + 快速衰减，没有持续段
    g.gain.setValueAtTime(0, at)
    g.gain.linearRampToValueAtTime(gain, at + 0.004)
    g.gain.exponentialRampToValueAtTime(0.0008, at + mel.len)
    osc.connect(g).connect(dest)
    osc.start(at)
    osc.stop(at + mel.len + 0.02)
  })
  return t0 + (mel.deg.length - 1) * mel.step + mel.len
}

/* ── 页面状态 ───────────────────────────────────────────────────────────── */
let duty = 0.5
let mel = MELODIES[0]
let char = 'chatgpt'
let ctx = null
function audio() {
  if (ctx === null) ctx = new (window.AudioContext || window.webkitAudioContext)()
  if (ctx.state === 'suspended') ctx.resume()
  return ctx
}

/* 占空比按钮 */
const dutyBox = document.getElementById('duty')
for (const d of [0.5, 0.25, 0.125, 0.75]) {
  const b = document.createElement('button')
  b.textContent = `duty ${(d * 100).toFixed(1).replace(/\.0$/, '')}%` + (d === 0.5 ? '（标准方波）' : d === 0.125 ? '（NES 细鼻音）' : '')
  b.className = d === duty ? 'on' : ''
  b.onclick = () => {
    duty = d
    ;[...dutyBox.children].forEach((x) => x.classList.remove('on'))
    b.classList.add('on')
    play()
  }
  dutyBox.appendChild(b)
}

/* 旋律表 */
const melBody = document.getElementById('mel')
MELODIES.forEach((m) => {
  const tr = document.createElement('tr')
  tr.innerHTML = `<td class="name">${m.name}</td><td class="desc">${m.desc}</td>`
  const td = document.createElement('td')
  const b = document.createElement('button')
  b.textContent = '试听'
  b.onclick = () => { mel = m; mark(); play() }
  td.appendChild(b)
  tr.appendChild(td)
  melBody.appendChild(tr)
  m._btn = b
})
function mark() { MELODIES.forEach((m) => m._btn.classList.toggle('on', m === mel)) }
mark()

/* 角色按钮 */
const charBox = document.getElementById('chars')
Object.keys(CHARS).forEach((id) => {
  const b = document.createElement('button')
  b.textContent = id
  b.onclick = () => { char = id; markChar(); play() }
  charBox.appendChild(b)
  b.dataset.id = id
})
function markChar() {
  ;[...charBox.children].forEach((b) => b.classList.toggle('on', b.dataset.id === char))
}
markChar()

/* ── 播放 + 离线渲染波形 ────────────────────────────────────────────────── */
async function play() {
  const c = audio()
  const root = charRoot(CHARS[char])
  const master = c.createGain()
  master.gain.value = 0.22
  master.connect(c.destination)
  const end = schedule(c, master, mel, root, duty, 0.9)
  await draw(mel, root)
  document.getElementById('meta').innerHTML =
    `旋律 <span class="key">${mel.name}</span> · 角色 <span class="key">${char}</span>` +
    ` · F0 ${CHARS[char]}Hz → 根音 ${root.toFixed(1)}Hz` +
    ` · duty ${(duty * 100).toFixed(1).replace(/\.0$/, '')}%` +
    ` · 时长 ${((end - c.currentTime) * 1000).toFixed(0)}ms`
}

/** 离线渲染同一段旋律，画包络 —— 顺便当客观校验用。 */
async function draw(m, root) {
  const dur = (m.deg.length - 1) * m.step + m.len + 0.06
  const off = new OfflineAudioContext(1, Math.ceil(44100 * dur), 44100)
  const g = off.createGain()
  g.gain.value = 0.9
  g.connect(off.destination)
  schedule(off, g, m, root, duty, 0.9)
  const buf = await off.startRendering()
  const d = buf.getChannelData(0)
  const cv = document.getElementById('wave')
  const g2 = cv.getContext('2d')
  const W = cv.width, H = cv.height
  g2.clearRect(0, 0, W, H)
  g2.strokeStyle = '#2a3a55'
  g2.beginPath(); g2.moveTo(0, H / 2); g2.lineTo(W, H / 2); g2.stroke()
  g2.strokeStyle = '#5fd0ff'
  g2.lineWidth = 2
  g2.beginPath()
  for (let x = 0; x < W; x++) {
    const s = Math.floor(x / W * d.length)
    const e = Math.floor((x + 1) / W * d.length)
    let peak = 0
    for (let i = s; i < e; i++) peak = Math.max(peak, Math.abs(d[i]))
    const y = H / 2 - peak * (H / 2 - 6)
    x === 0 ? g2.moveTo(x, y) : g2.lineTo(x, y)
  }
  g2.stroke()
  return buf
}

/* 给自动化校验用 */
window.__lab = {
  MELODIES, CHARS, charRoot, hz, quantize, pulseWave, schedule, draw,
  async render(melId, dutyV, rootHz) {
    const m = MELODIES.find((x) => x.id === melId)
    const dur = (m.deg.length - 1) * m.step + m.len + 0.06
    const off = new OfflineAudioContext(1, Math.ceil(48000 * dur), 48000)
    const g = off.createGain(); g.gain.value = 1; g.connect(off.destination)
    schedule(off, g, m, rootHz, dutyV, 0.9)
    const b = await off.startRendering()
    return Array.from(b.getChannelData(0))
  },
}

play()
</script>
</body>
</html>
